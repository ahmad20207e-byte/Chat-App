<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دردشة</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2933;--mut:#7b8794;--acc:#0f766e;--mine:#d9f2ee;--line:#e4e0d8}
@media (prefers-color-scheme:dark){:root{--bg:#14181c;--card:#1e242a;--ink:#e8ecef;--mut:#8b97a3;--acc:#2dd4bf;--mine:#14423d;--line:#2c343c}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column}
header{padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:700}
header a{color:var(--mut);font-weight:400;font-size:13px;cursor:pointer}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;padding:8px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);align-self:flex-start;word-wrap:break-word}
.m.me{background:var(--mine);align-self:flex-end}
.m b{display:block;font-size:12px;color:var(--acc);margin-bottom:2px}
.m i{display:block;font-size:11px;color:var(--mut);font-style:normal;margin-top:2px}
form.send{display:flex;gap:8px;padding:10px;background:var(--card);border-top:1px solid var(--line)}
input{padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px;min-width:0}
form.send input{flex:1;border-radius:22px}
button{padding:11px 18px;border:0;border-radius:22px;background:var(--acc);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
#auth{margin:auto;width:min(90%,340px);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center}
#auth h2{margin:0 0 14px}
#auth input{width:100%;box-sizing:border-box;margin-bottom:10px}
#auth button{width:100%;border-radius:12px}
#sw{display:block;margin-top:12px;color:var(--mut);font-size:14px;cursor:pointer}
#err{color:#d64545;font-size:14px;min-height:18px;margin-bottom:6px}
.hide{display:none!important}
</style>
</head>
<body>
<header><span>💬 دردشة</span><a id="out" class="hide">خروج</a></header>

<div id="auth">
  <h2 id="title">تسجيل الدخول</h2>
  <input id="u" placeholder="اسم المستخدم" autocomplete="username" autocapitalize="none">
  <input id="p" type="password" placeholder="كلمة السر" autocomplete="current-password">
  <div id="err"></div>
  <button id="go">دخول</button>
  <a id="sw">ما عندكش حساب؟ أنشئ حساب</a>
</div>

<div id="msgs" class="hide"></div>
<form id="f" class="send hide"><input id="t" maxlength="500" placeholder="اكتب رسالة…" autocomplete="off"><button>إرسال</button></form>

<script>
const $=id=>document.getElementById(id);
let mode='login', me=null, ws=null;

$('sw').onclick=()=>{
  mode=mode==='login'?'register':'login';
  $('title').textContent=mode==='login'?'تسجيل الدخول':'إنشاء حساب';
  $('go').textContent=mode==='login'?'دخول':'تسجيل';
  $('sw').textContent=mode==='login'?'ما عندكش حساب؟ أنشئ حساب':'عندك حساب؟ سجّل الدخول';
  $('err').textContent='';
};
$('go').onclick=async()=>{
  $('err').textContent='';
  try{
    const r=await fetch('/api/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:$('u').value,password:$('p').value})});
    const d=await r.json();
    if(!r.ok) return $('err').textContent=d.error||'Erreur';
    localStorage.setItem('chat_token',d.token); localStorage.setItem('chat_user',d.username);
    open_chat();
  }catch(e){ $('err').textContent='مشكل في الاتصال'; }
};
$('out').onclick=()=>{ localStorage.clear(); location.reload(); };

function add(m){
  const box=$('msgs'), el=document.createElement('div');
  el.className='m'+(m.u===me?' me':'');
  const b=document.createElement('b'); b.textContent=m.u;
  const p=document.createElement('span'); p.textContent=m.text;
  const t=document.createElement('i'); t.textContent=new Date(m.ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  el.append(b,p,t); box.append(el); box.scrollTop=box.scrollHeight;
}
function open_chat(){
  const token=localStorage.getItem('chat_token'); me=localStorage.getItem('chat_user');
  if(!token) return;
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?token='+token);
  ws.onopen=()=>{ $('auth').classList.add('hide'); $('msgs').classList.remove('hide'); $('f').classList.remove('hide'); $('out').classList.remove('hide'); $('msgs').textContent=''; };
  ws.onmessage=e=>{ const d=JSON.parse(e.data); if(d.type==='history') d.messages.forEach(add); else add(d.msg); };
  ws.onclose=ev=>{
    if(ev.code===4001){ localStorage.clear(); location.reload(); }
    else setTimeout(open_chat,2000);
  };
}
$('f').onsubmit=e=>{
  e.preventDefault(); const v=$('t').value.trim();
  if(v&&ws&&ws.readyState===1){ ws.send(JSON.stringify({text:v})); $('t').value=''; }
};
if(localStorage.getItem('chat_token')) open_chat();
</script>
</body>
</html>
